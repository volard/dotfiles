---
- name: Configure dotfiles and system settings
  hosts: all
  gather_facts: true

  vars:
    selected_role_tags: "{{ ansible_run_tags | default([]) | difference(['all', 'always', 'tagged', 'untagged']) }}"

  pre_tasks:
    - name: Include Windows pre-tasks
      ansible.builtin.include_tasks: pre_tasks/windows.yml
      when: ansible_facts['os_family'] == 'Windows'
      tags:
        - always

    - name: Include Ubuntu pre-tasks
      ansible.builtin.include_tasks: pre_tasks/Ubuntu.yml
      when: ansible_facts['distribution'] == 'Ubuntu'
      tags:
        - always

    - name: Include Fedora pre-tasks
      ansible.builtin.include_tasks: pre_tasks/Fedora.yml
      when: ansible_facts['distribution'] == 'Fedora'
      tags:
        - always

  roles:
    - role: powershell
      when: "'powershell' in enabled_roles or 'powershell' in selected_role_tags"
      tags:
        - powershell

    - role: virtual
      when: "'virtual' in enabled_roles or 'virtual' in selected_role_tags"
      tags:
        - virtual

    - role: ssh
      when: "'ssh' in enabled_roles or 'ssh' in selected_role_tags"
      tags:
        - ssh

    - role: sway
      when: "'sway' in enabled_roles or 'sway' in selected_role_tags"
      tags:
        - sway

    - role: neovim
      when: "'neovim' in enabled_roles or 'neovim' in selected_role_tags"
      tags:
        - neovim

    - role: gtk
      when: "'gtk' in enabled_roles or 'gtk' in selected_role_tags"
      tags:
        - gtk

    - role: user_groups
      when: "'user_groups' in enabled_roles or 'user_groups' in selected_role_tags"
      tags:
        - user_groups

    - role: i3
      when: "'i3' in enabled_roles or 'i3' in selected_role_tags"
      tags:
        - i3

    - role: docker
      when: "'docker' in enabled_roles or 'docker' in selected_role_tags"
      tags:
        - docker

    - role: incus
      when: "'incus' in enabled_roles or 'incus' in selected_role_tags"
      tags:
        - incus

    - role: wezterm
      when: "'wezterm' in enabled_roles or 'wezterm' in selected_role_tags"
      tags:
        - wezterm

    - role: neovim
      when: "'neovim' in enabled_roles or 'neovim' in selected_role_tags"
      tags:
        - neovim

    - role: bemoji
      when: "'bemoji' in enabled_roles or 'bemoji' in selected_role_tags"
      tags:
        - bemoji

    - role: vnc
      when: "'vnc' in enabled_roles or 'vnc' in selected_role_tags"
      tags:
        - vnc

    - role: hiddify
      when: "'hiddify' in enabled_roles or 'hiddify' in selected_role_tags"
      tags:
        - hiddify

    - role: voxtype
      when: "'voxtype' in enabled_roles or 'voxtype' in selected_role_tags"
      tags:
        - voxtype

    - role: chezmoi
      when: "'chezmoi' in enabled_roles or 'chezmoi' in selected_role_tags"
      tags:
        - chezmoi

    - role: programs
      when: "'programs' in enabled_roles or 'programs' in selected_role_tags"
      tags:
        - programs

    - role: bluetooth
      when: "'bluetooth' in enabled_roles or 'bluetooth' in selected_role_tags"
      tags:
        - bluetooth

    - role: latex
      when: "'latex' in enabled_roles or 'latex' in selected_role_tags"
      tags:
