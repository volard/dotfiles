---
- name: Copy Ansible-managed encrypted SSH config files
  when: role_name == 'ssh'
  block:
    - name: Ensure config directory exists
      ansible.builtin.file:
        path: "{{ config_path }}"
        state: directory
        mode: "0700"

    - name: Copy SSH files
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "{{ config_path }}/{{ item | basename }}"
        mode: "{{ '0644' if (item | basename).endswith('.pub') else '0600' }}"
      loop: "{{ query('ansible.builtin.fileglob', role_path + '/files/*') }}"
      no_log: true

- name: Skip role-managed config copies
  ansible.builtin.debug:
    msg: "User config files are managed by chezmoi now."
  when: role_name != 'ssh'
