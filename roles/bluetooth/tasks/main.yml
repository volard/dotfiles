---
- name: Install packages from pacman
  community.general.pacman:
    name: "{{ pacman_item }}"
    state: present
  loop:
    - blueman
    - bluez
    - bluez-utils
  become: true
  loop_control:
    loop_var: pacman_item
  when: ansible_facts['distribution'] == "Archlinux"

- name: Start bluetooth service
  ansible.builtin.command: systemctl start bluetooth
  become: true

- name: Enable bluetooth service
  ansible.builtin.command: systemctl enable bluetooth
  become: true
