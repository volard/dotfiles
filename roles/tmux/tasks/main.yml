---
- name: Install packages from pacman
  community.general.pacman:
    name: "{{ pacman_item }}"
    state: present
  loop:
    - tmux
  become: true
  loop_control:
    loop_var: pacman_item
  when: ansible_facts['distribution'] == "Archlinux"

- name: Install DNF plugins core
  ansible.builtin.dnf:
    name: tmux
    state: present
  become: true
  when: ansible_facts['distribution'] == 'Fedora'
