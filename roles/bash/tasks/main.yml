---
- name: Ensure .config directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.config"
    state: directory
    mode: "0755"

- name: Ensure .bashrc file exists
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.bashrc"
    state: file

- name: Check if source line already exists
  ansible.builtin.command: grep -Fxq "source $HOME/.config/.termrc" "{{ ansible_facts['user_dir'] }}/.bashrc"
  register: grep_result
  changed_when: false
  failed_when: false

- name: Add source line to existing .bashrc
  ansible.builtin.lineinfile:
    path: "{{ ansible_facts['user_dir'] }}/.bashrc"
    line: source $HOME/.config/.termrc
    state: present
  when:
    - grep_result.rc != 0 # Only add line if grep didn't find it
