"$schema" = 'https://starship.rs/config-schema.json'
format = """$username$hostname$directory$fill[$all](grey)$time$line_break$character"""

# ── Shell interaction ──────────────────────────────────────────────

[character]
success_symbol = "[@](bold green)"
error_symbol = "[@](bold red)"

[fill]
symbol = '─'

# ── Context modules ────────────────────────────────────────────────

[username]
format = "[$user]($style)"
show_always = false

[hostname]
ssh_only = true
format = "[$hostname]($style)"
disabled = false

[directory]
truncation_length = 4
truncate_to_repo = true
format = "[$path]($style)"

[shell]
disabled = true

# ── Time ────────────────────────────────────────────────────────────

[time]
disabled = false
time_format = "%F %T"
format = '[$time]($style)'

# ── Command duration ──────────────────────────────────────────────

[cmd_duration]
min_time = 10000
format = "[⏱ $duration]($style)"

# ── Git modules ────────────────────────────────────────────────────

[git_branch]
symbol = "git "

# ── Language runtimes ──────────────────────────────────────────────

[nodejs]
symbol = "node "
format = "[$symbol($version )]($style)"

[rust]
symbol = "rs "
format = "[$symbol($version )]($style)"

[golang]
symbol = "go "
format = "[$symbol($version )]($style)"

[python]
symbol = "py "
format = "[$symbol($version )]($style)"

# ── Cloud / DevOps ────────────────────────────────────────────────

[aws]
symbol = "aws "
format = "[$symbol($profile )]($style)"

[gcloud]
symbol = "gcp "
format = "[$symbol($active )]($style)"

[kubernetes]
symbol = "k8s "
format = '[$symbol\($context\)]($style)'

[terraform]
symbol = "tf "
format = "[$symbol($workspace)]($style)"

# ── Package management ────────────────────────────────────────────

[package]
symbol = "package "
format = "[$symbol$version]($style)"

# ── System modules ────────────────────────────────────────────────

[jobs]
symbol = "⚙ "
format = "[$symbol$number]($style)"
threshold = 1

[memory_usage]
disabled = true

[shlvl]
format = "[$shlvl]($style)"
threshold = 2
